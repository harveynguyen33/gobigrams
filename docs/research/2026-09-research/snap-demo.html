<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Snap to grid — what it does</title>
<style>
  :root{
    --bg:#0b0b0d; --surface:#131316; --elevated:#1a1b1f; --border:#26272c;
    --fg:#e8e8ea; --dim:#8a8a92; --acc:#f54e00; --acc-soft:rgba(245,78,0,.14);
    --dots:rgba(255,255,255,.12);
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--fg);font-family:var(--sans);padding:16px;overflow:hidden}
  h1{font-family:var(--mono);font-size:13px;letter-spacing:.04em;margin-bottom:2px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:14px}
  .bar{display:flex;align-items:center;gap:14px;margin-bottom:12px;flex-wrap:wrap}
  .sw{display:flex;align-items:center;gap:8px;font-size:13px}
  .track{width:38px;height:22px;border-radius:999px;background:var(--elevated);border:1px solid var(--border);position:relative;cursor:pointer;flex:none}
  .track::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--dim);transition:left .15s,background .15s}
  .track.on{background:var(--acc-soft);border-color:var(--acc)}
  .track.on::after{left:18px;background:var(--acc)}
  .read{font-family:var(--mono);font-size:12px;color:var(--dim)}
  .read b{color:var(--acc)}
  .stage{position:relative;height:340px;border:1px solid var(--border);border-radius:10px;overflow:hidden;
         background-image:radial-gradient(var(--dots) 1.2px,transparent 1.2px);background-size:16px 16px}
  .node{position:absolute;width:96px;height:52px;border:1.5px solid var(--acc);border-radius:8px;
        background:color-mix(in srgb,var(--acc) 12%,transparent);display:grid;place-items:center;
        font-family:var(--mono);font-size:11px;cursor:grab;user-select:none}
  .node:active{cursor:grabbing}
  .ghost{position:absolute;width:96px;height:52px;border:1.5px dashed var(--border);border-radius:8px;
         pointer-events:none;display:none}
  .guides{position:absolute;inset:0;pointer-events:none}
  .gl{position:absolute;background:var(--acc);opacity:.35}
  .note{font-size:11.5px;color:var(--dim);font-family:var(--mono);margin-top:10px;line-height:1.6}
</style>
</head>
<body>
  <h1>Snap to grid</h1>
  <div class="sub">Drag the box. Watch where it lands.</div>

  <div class="bar">
    <div class="sw">
      <div class="track" id="tg"></div>
      <span>Snap to grid</span>
    </div>
    <div class="read">landed at: <b id="pos">—</b></div>
  </div>

  <div class="stage" id="stage">
    <div class="guides" id="guides"></div>
    <div class="ghost" id="ghost"></div>
    <div class="node" id="node" style="left:120px;top:140px">node</div>
  </div>

  <div class="note" id="note">
    ON: the box lands on multiples of 16 (0, 16, 32…) — it never rests between the dots.
  </div>

<script>
const G = 16;
const stage = document.getElementById('stage');
const node  = document.getElementById('node');
const ghost = document.getElementById('ghost');
const guides= document.getElementById('guides');
const tg    = document.getElementById('tg');
const posEl = document.getElementById('pos');
const note  = document.getElementById('note');

let snap = true;
let dragging = false, offX = 0, offY = 0;

function pctOf(v){ return (v % G + G) % G; }

function report(){
  const x = parseInt(node.style.left, 10);
  const y = parseInt(node.style.top, 10);
  posEl.textContent = `x ${x} · y ${y}`;
}

function showGuides(x, y){
  // dotted cross-hair showing which grid line the snap will land on
  guides.innerHTML = '';
  const sx = Math.round(x / G) * G, sy = Math.round(y / G) * G;
  for (const [v, horiz] of [[sx, false], [sy, true]]) {
    const el = document.createElement('div');
    el.className = 'gl';
    if (horiz) { el.style.top = v + 'px'; el.style.left = '0'; el.style.right = '0'; el.style.height = '1px'; }
    else       { el.style.left = v + 'px'; el.style.top = '0'; el.style.bottom = '0'; el.style.width = '1px'; }
    guides.appendChild(el);
  }
}

tg.onclick = () => {
  snap = !snap;
  tg.classList.toggle('on', snap);
  note.textContent = snap
    ? 'ON: the box lands on multiples of 16 (0, 16, 32…) — it never rests between the dots.'
    : 'OFF: the box lands exactly where you drop it — any pixel. It can sit between the dots.';
  if (snap) { // re-snap current position
    const x = parseInt(node.style.left,10), y = parseInt(node.style.top,10);
    node.style.left = (Math.round(x/G)*G) + 'px';
    node.style.top  = (Math.round(y/G)*G) + 'px';
    showGuides(parseInt(node.style.left,10), parseInt(node.style.top,10));
  } else { guides.innerHTML=''; }
  report();
};

node.addEventListener('pointerdown', e => {
  dragging = true;
  const r = node.getBoundingClientRect();
  offX = e.clientX - r.left; offY = e.clientY - r.top;
  node.setPointerCapture(e.pointerId);
});

node.addEventListener('pointermove', e => {
  if (!dragging) return;
  const sr = stage.getBoundingClientRect();
  let x = e.clientX - sr.left - offX;
  let y = e.clientY - sr.top  - offY;

  if (snap) {
    const sx = Math.round(x / G) * G, sy = Math.round(y / G) * G;
    // ghost preview of the snapped slot
    ghost.style.display = 'block';
    ghost.style.left = sx + 'px'; ghost.style.top = sy + 'px';
    showGuides(sx, sy);
    posEl.textContent = `free ${Math.round(x)} → snaps to ${sx}`;
  } else {
    ghost.style.display = 'none';
    guides.innerHTML = '';
    posEl.textContent = `x ${Math.round(x)} · y ${Math.round(y)}`;
  }
  node.style.left = x + 'px';
  node.style.top  = y + 'px';
});

function endDrag(e){
  if (!dragging) return;
  dragging = false;
  ghost.style.display = 'none';
  guides.innerHTML = '';
  let x = parseInt(node.style.left,10), y = parseInt(node.style.top,10);
  if (snap) { x = Math.round(x/G)*G; y = Math.round(y/G)*G; }
  node.style.left = x + 'px';
  node.style.top  = y + 'px';
  report();
}
node.addEventListener('pointerup', endDrag);
node.addEventListener('pointercancel', endDrag);

// init
tg.classList.add('on');
showGuides(120,140);
report();
</script>
</body>
</html>
