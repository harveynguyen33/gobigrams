<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagram Studio — L mockup (presets + themes)</title>
<style>
  /* ============ L1 token layers (the real proposal) ============ */
  :root, [data-theme="dark"] {
    color-scheme: dark;
    --bg:#0b0b0d; --surface:#131316; --elevated:#1a1b1f; --border:#26272c; --border-strong:#33343a;
    --fg:#e8e8ea; --dim:#8a8a92; --dim2:#6b6b73;
    --acc:#f54e00; --acc-soft:rgba(245,78,0,.12); --sel:#3b82f6; --sel-soft:rgba(59,130,246,.14);
    --green:#4ade80; --red:#f87171;
    --cyan:#22d3ee; --violet:#a78bfa; --amber:#fbbf24; --slate:#94a3b8; --pink:#ec4899;
    --grid:rgba(255,255,255,.07); --shadow:0 1px 0 rgba(0,0,0,.4);
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg:#fbfbfc; --surface:#ffffff; --elevated:#f4f5f7; --border:#e3e5e9; --border-strong:#cfd3da;
    --fg:#16181d; --dim:#5b6070; --dim2:#82879a;
    --acc:#c73e00; --acc-soft:rgba(199,62,0,.10); --sel:#2563eb; --sel-soft:rgba(37,99,235,.12);
    --green:#15803d; --red:#dc2626;
    --cyan:#0e7490; --violet:#6d28d9; --amber:#a16207; --slate:#475569; --pink:#be185d;
    --grid:rgba(0,0,0,.07); --shadow:0 1px 2px rgba(16,24,40,.06);
  }
  [data-theme="paper"] {
    color-scheme: light;
    --bg:#f7f2e8; --surface:#fffdf7; --elevated:#f1e9da; --border:#e4d9c4; --border-strong:#d0c2a6;
    --fg:#2b2419; --dim:#6f6350; --dim2:#96876e;
    --acc:#b4531f; --acc-soft:rgba(180,83,31,.12); --sel:#1d6fb8; --sel-soft:rgba(29,111,184,.12);
    --green:#3f7d3f; --red:#b23b3b;
    --cyan:#1a7f8f; --violet:#7a4fa3; --amber:#94660c; --slate:#6b6154; --pink:#a83f6f;
    --grid:rgba(60,45,25,.09); --shadow:0 1px 2px rgba(70,55,30,.10);
  }
  [data-theme="midnight"] {
    color-scheme: dark;
    --bg:#070a12; --surface:#0d121f; --elevated:#141b2c; --border:#1e2740; --border-strong:#2b3757;
    --fg:#dfe6f5; --dim:#8590aa; --dim2:#5f6a85;
    --acc:#7c5cff; --acc-soft:rgba(124,92,255,.14); --sel:#38bdf8; --sel-soft:rgba(56,189,248,.16);
    --green:#34d399; --red:#fb7185;
    --cyan:#38bdf8; --violet:#a78bfa; --amber:#fcd34d; --slate:#94a3b8; --pink:#f472b6;
    --grid:rgba(120,150,220,.10); --shadow:0 1px 0 rgba(0,0,0,.5);
  }
  [data-theme="contrast"] {
    color-scheme: dark;
    --bg:#000000; --surface:#0a0a0a; --elevated:#141414; --border:#3a3a3a; --border-strong:#5c5c5c;
    --fg:#ffffff; --dim:#c8c8c8; --dim2:#9a9a9a;
    --acc:#ff7a1a; --acc-soft:rgba(255,122,26,.20); --sel:#4d9bff; --sel-soft:rgba(77,155,255,.24);
    --green:#3ef08a; --red:#ff6b6b;
    --cyan:#3fe0ff; --violet:#c3a4ff; --amber:#ffd23f; --slate:#cfd6e0; --pink:#ff7ac6;
    --grid:rgba(255,255,255,.14); --shadow:none;
  }

  * { box-sizing: border-box; }
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display:flex; flex-direction:column; height:100vh; overflow:hidden;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}

  /* ---------- top bar ---------- */
  header{
    display:flex; align-items:center; gap:10px; padding:0 12px; height:46px;
    background:var(--surface); border-bottom:1px solid var(--border); flex:0 0 auto;
  }
  .brand{font-weight:700; letter-spacing:.2px}
  .brand b{color:var(--acc)}
  .crumb{color:var(--dim); font-size:12px}
  .spacer{flex:1}
  .seg{display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden; background:var(--elevated)}
  .seg button{
    background:transparent; color:var(--dim); border:0; padding:7px 11px; cursor:pointer; font:inherit; font-size:12px;
  }
  .seg button:hover{color:var(--fg)}
  .seg button.on{background:var(--acc-soft); color:var(--acc); font-weight:600}
  .ico{
    width:30px;height:30px;border:1px solid var(--border);border-radius:7px;background:var(--elevated);
    color:var(--dim);cursor:pointer;display:grid;place-items:center;font-size:14px
  }
  .ico:hover{color:var(--fg);border-color:var(--border-strong)}

  /* ---------- preset picker ---------- */
  .presetbar{
    display:flex; align-items:center; gap:8px; padding:8px 12px; flex:0 0 auto;
    background:var(--surface); border-bottom:1px solid var(--border); overflow-x:auto;
  }
  .presetbar .lbl{color:var(--dim); font-size:11px; text-transform:uppercase; letter-spacing:.6px; margin-right:2px}
  .pchip{
    display:flex; flex-direction:column; gap:1px; align-items:flex-start; text-align:left;
    border:1px solid var(--border); background:var(--elevated); color:var(--fg);
    border-radius:9px; padding:7px 12px; cursor:pointer; white-space:nowrap; font:inherit;
  }
  .pchip small{color:var(--dim); font-size:10.5px}
  .pchip:hover{border-color:var(--border-strong)}
  .pchip.on{border-color:var(--acc); background:var(--acc-soft)}
  .pchip.on small{color:var(--acc)}

  /* ---------- body 3 columns ---------- */
  .main{display:flex; flex:1; min-height:0}
  aside.panel{width:212px; background:var(--surface); border-right:1px solid var(--border); display:flex; flex-direction:column; flex:0 0 auto}
  aside.right{border-right:0; border-left:1px solid var(--border); width:236px}
  .phead{padding:10px 12px; border-bottom:1px solid var(--border); font-size:11px; letter-spacing:.6px; text-transform:uppercase; color:var(--dim)}
  .pbody{padding:8px; overflow:auto; flex:1}
  .pal{display:grid; grid-template-columns:1fr 1fr; gap:6px}
  .pit{
    border:1px solid var(--border); background:var(--elevated); border-radius:8px; padding:8px 6px;
    cursor:grab; display:flex; flex-direction:column; align-items:center; gap:5px; font-size:10.5px; color:var(--dim);
  }
  .pit:hover{border-color:var(--border-strong); color:var(--fg)}
  .pit svg{width:30px;height:22px}
  .pit .sw{width:100%;height:2px;background:currentColor;opacity:0}
  .pit span{text-align:center; line-height:1.2}

  .canvas{flex:1; position:relative; min-width:0; background:
     radial-gradient(circle at 1px 1px, var(--grid) 1px, transparent 0) 0 0/16px 16px, var(--bg);}
  .flow{position:absolute; inset:0; padding:26px}
  .legend{
    position:absolute; left:14px; bottom:14px; background:var(--surface); border:1px solid var(--border);
    border-radius:9px; padding:8px 10px; font-size:11px; color:var(--dim); box-shadow:var(--shadow); display:none
  }
  .legend.on{display:block}
  .legend h4{margin:0 0 6px; font-size:10px; text-transform:uppercase; letter-spacing:.6px; color:var(--fg)}
  .lgrow{display:flex; align-items:center; gap:7px; margin:3px 0}
  .dot{width:9px;height:9px;border-radius:3px}
  .zoompill{
    position:absolute; right:14px; bottom:14px; background:var(--surface); border:1px solid var(--border);
    border-radius:8px; padding:5px 9px; color:var(--dim); font-size:11px; box-shadow:var(--shadow)
  }

  /* ---------- nodes ---------- */
  .node{
    position:absolute; background:var(--surface); border:1px solid var(--border);
    border-radius:10px; padding:9px 11px; min-width:120px; box-shadow:var(--shadow); cursor:grab;
  }
  .node:hover{border-color:var(--border-strong)}
  .node .k{font-size:9.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--dim); font-weight:600}
  .node .t{font-weight:600; font-size:12.5px; margin-top:2px}
  .node .s{font-size:10.5px; color:var(--dim); margin-top:1px}
  .node .m{font-size:10px; color:var(--acc); margin-top:5px; font-family:ui-monospace,monospace}
  .node .topline{position:absolute; left:0; right:0; top:0; height:3px; border-radius:10px 10px 0 0; background:var(--nc, var(--slate))}
  .node.term{border-radius:999px; text-align:center; padding:12px 20px; border-color:var(--nc)}
  .node.dec{width:150px;height:96px;display:grid;place-items:center;border:0;background:transparent;box-shadow:none;padding:0}
  .dia{position:absolute;inset:0;background:var(--surface);border:1.5px solid var(--nc);transform:rotate(45deg) scale(.72);border-radius:6px}
  .dec .inner{position:relative;z-index:1;text-align:center;font-size:11.5px;font-weight:600;max-width:96px}
  .node.io-clip{clip-path:polygon(12% 0,100% 0,88% 100%,0 100%);border:0;border-radius:0;background:var(--elevated);outline:1.5px solid var(--nc);outline-offset:-1.5px}
  .node.doc{background:var(--surface);border:0;position:relative}
  .node.doc::before{content:"";position:absolute;inset:0;border:1.5px solid var(--nc);border-radius:10px 10px 0 0;border-bottom:0}
  .node.doc::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;
    background:radial-gradient(circle at 12px 10px, transparent 9px, var(--surface) 9px) repeat-x; background-size:24px 12px;
    border-bottom:1.5px solid var(--nc); border-radius:0 0 8px 8px}
  .node.circle{border-radius:999px;width:44px;height:44px;min-width:0;display:grid;place-items:center;padding:0}
  .node.circle .t{font-size:11px;margin:0}

  /* table node (ERD) */
  .tblnode{position:absolute;background:var(--surface);border:1px solid var(--border);border-radius:9px;box-shadow:var(--shadow);overflow:hidden;min-width:180px}
  .tblnode header{height:auto;display:block;padding:7px 10px;background:var(--elevated);border-bottom:1px solid var(--border);font-weight:600;font-size:12px}
  .tblnode header{border-left:3px solid var(--nc)}
  .col{display:flex;align-items:center;gap:7px;padding:4px 10px;font-size:11px;border-bottom:1px solid var(--border)}
  .col:last-child{border-bottom:0}
  .col .name{flex:1;font-weight:500}
  .col .ty{color:var(--dim);font-size:10px;font-family:ui-monospace,monospace}
  .col .pk{color:var(--amber);font-size:10px;font-weight:700}
  .col .fk{color:var(--cyan);font-size:10px;font-weight:700}
  .col .nn{width:6px;height:6px;border-radius:50%;background:var(--nc)}
  .col .nu{width:6px;height:6px;border-radius:50%;border:1.5px solid var(--dim2)}
  .col.dim .ty{opacity:0; transition:opacity .15s}
  .col:hover .ty{opacity:1}

  /* edges (svg) */
  svg.edges{position:absolute; inset:0; pointer-events:none; overflow:visible}
  svg.edges path{fill:none; stroke:var(--slate); stroke-width:1.8}
  svg.edges path.dashed{stroke-dasharray:5 5}
  svg.edges text{fill:var(--dim); font-size:10.5px; font-family:ui-monospace,monospace}
  svg.edges rect.lbl{fill:var(--elevated); stroke:var(--border)}
  .payload{fill:var(--acc)}

  /* inspector */
  .field{padding:9px 11px; border-bottom:1px solid var(--border)}
  .field label{display:block; font-size:10px; text-transform:uppercase; letter-spacing:.5px; color:var(--dim); margin-bottom:6px}
  .swatches{display:flex; gap:6px; flex-wrap:wrap}
  .sw{width:20px;height:20px;border-radius:6px;border:1px solid var(--border);cursor:pointer}
  .sw.on{outline:2px solid var(--sel); outline-offset:1px}
  .row{display:flex; gap:6px; flex-wrap:wrap}
  .mbtn{border:1px solid var(--border);background:var(--elevated);color:var(--dim);border-radius:7px;padding:5px 9px;font:inherit;font-size:11px;cursor:pointer}
  .mbtn.on{border-color:var(--sel);color:var(--sel)}
  .mbtn:hover{color:var(--fg)}
  .hint{color:var(--dim); font-size:11px; padding:10px 11px}
  .badge{display:inline-block;font-size:9.5px;border:1px solid var(--border);border-radius:999px;padding:1px 7px;color:var(--dim);background:var(--elevated)}
  .warn{margin:10px 11px;padding:9px 10px;border:1px solid var(--acc);background:var(--acc-soft);border-radius:8px;font-size:11px;color:var(--fg)}
  .warn b{color:var(--acc)}

  @media (max-width:820px){ aside.right{display:none} }
</style>
</head>
<body>

<header>
  <div class="brand">diagram<b>·</b>studio</div>
  <div class="crumb mono">~/lab/diagram-studio</div>
  <div class="spacer"></div>
  <div class="seg" id="presetTop"></div>
  <div style="width:12px"></div>
  <span class="badge" id="themeName">dark</span>
  <div class="seg" id="themeSeg">
    <button data-theme-btn="dark" class="on">dark</button>
    <button data-theme-btn="light">light</button>
    <button data-theme-btn="system">system</button>
    <button data-theme-btn="paper">paper</button>
    <button data-theme-btn="midnight">midnight</button>
    <button data-theme-btn="contrast">contrast</button>
  </div>
  <button class="ico" title="Export">⤓</button>
</header>

<div class="presetbar" id="presetBar"></div>

<div class="main">
  <aside class="panel">
    <div class="phead">Shapes</div>
    <div class="pbody"><div class="pal" id="palette"></div></div>
    <div class="hint" id="palHint"></div>
  </aside>

  <div class="canvas" id="canvas">
    <svg class="edges" id="edgeLayer"></svg>
    <div class="flow" id="flowLayer"></div>
    <div class="legend" id="legend">
      <h4 id="legendTitle">Legend</h4>
      <div id="legendRows"></div>
    </div>
    <div class="zoompill mono">100%</div>
  </div>

  <aside class="panel right">
    <div class="phead">Inspector</div>
    <div class="pbody" id="inspector"></div>
  </aside>
</div>

<script>
const ACC = {cyan:'#22d3ee',violet:'#a78bfa',amber:'#fbbf24',slate:'#94a3b8',accent:'#f54e00',green:'#4ade80',pink:'#ec4899'};
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();
const col = k => cssVar(k) || ACC[k] || '#888';

/* ---------- presets (mirrors §E.2 / §E.7) ---------- */
const PRESETS = {
  architecture: {
    label:'Architecture', hint:'services · datastores · boundaries',
    palette:[['service','Service','cyan','rect'],['database','Database','violet','cyl'],['queue','Queue','amber','layers'],
             ['external','External','accent','dash'],['actor','Actor','green','actor'],['storage','Storage','amber','bucket'],
             ['gateway','Gateway','pink','hex'],['group','Group','slate','group'],['note','Note','amber','note']],
    edges:{dashed:false, path:'curved'},
    layout:'left → right · layered',
    legend:[['cyan','Container / service'],['violet','Datastore'],['amber','Queue / storage']],
    sample:'architecture'
  },
  flowchart: {
    label:'Flowchart', hint:'steps · decisions · lanes',
    palette:[['terminator','Start / End','green','term'],['process','Process','cyan','rect'],['decision','Decision','amber','dia'],
             ['io','Input / Output','violet','para'],['document','Document','slate','doc'],['subprocess','Subprocess','cyan','sub'],
             ['manual','Manual op','pink','trap'],['delay','Delay','amber','delay'],['connector','Connector','slate','circle']],
    edges:{dashed:false, path:'smoothstep'},
    layout:'top → bottom · layered',
    legend:[['green','Terminal'],['amber','Decision'],['cyan','Process']],
    sample:'flowchart'
  },
  c4: {
    label:'C4 — Context', hint:'people · systems · boundaries',
    palette:[['actor','Person','green','actor'],['service','Software System','cyan','rect'],['external','External System','slate','dash'],
             ['database','Container: DB','violet','cyl'],['queue','Container: Queue','amber','layers'],['group','Boundary','slate','group'],['note','Note','amber','note']],
    edges:{dashed:true, path:'smoothstep'},
    layout:'left → right · layered',
    legend:[['green','Person'],['cyan','Internal system'],['slate','External']],
    sample:'c4'
  },
  erd: {
    label:'Database / ERD', hint:'tables · columns · relationships',
    palette:[['table','Table','cyan','table'],['note','Note','amber','note']],
    edges:{dashed:false, path:'straight'},
    layout:'grid · free',
    legend:[['amber','Primary key'],['cyan','Foreign key'],['slate','Relationship']],
    sample:'erd'
  },
  mindmap: {
    label:'Mindmap', hint:'central idea · branches',
    palette:[['note','Topic','cyan','pill'],['note','Sub-topic','violet','pill'],['actor','Person','green','actor'],['note','Note','amber','note']],
    edges:{dashed:false, path:'straight'},
    layout:'radial',
    legend:[['cyan','Topic'],['violet','Branch']],
    sample:'mindmap'
  },
  custom: {
    label:'Custom / Blank', hint:'everything — mix freely',
    palette:[['service','Service','cyan','rect'],['database','Database','violet','cyl'],['decision','Decision','amber','dia'],
             ['terminator','Terminator','green','term'],['table','Table','cyan','table'],['actor','Person','green','actor'],
             ['external','External','slate','dash'],['note','Note','amber','note']],
    edges:{dashed:false, path:'curved'},
    layout:'free',
    legend:[['slate','Mixed']],
    sample:'architecture'
  }
};

/* ---------- tiny shape glyphs for the palette ---------- */
function glyph(k, color){
  const c = `fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"`;
  const s = {rect:`<rect x="3" y="3" width="26" height="16" rx="3" ${c}/>`,
    cyl:`<ellipse cx="16" cy="6" rx="11" ry="3" ${c}/><path d="M5 6v12a11 3 0 0 0 22 0V6" ${c}/>`,
    layers:`<rect x="4" y="4" width="24" height="6" rx="2" ${c}/><rect x="4" y="12" width="24" height="6" rx="2" ${c}/>`,
    dash:`<rect x="3" y="3" width="26" height="16" rx="3" ${c} stroke-dasharray="4 3"/>`,
    actor:`<circle cx="16" cy="7" r="4" ${c}/><path d="M8 20c0-4 4-6 8-6s8 2 8 6" ${c}/>`,
    bucket:`<path d="M6 6h20l-3 14H9z" ${c}/><path d="M10 6V3h12v3" ${c}/>`,
    hex:`<path d="M10 3h12l6 8-6 8H10l-6-8z" ${c}/>`,
    group:`<rect x="2" y="2" width="28" height="18" rx="4" ${c} stroke-dasharray="5 3"/><rect x="6" y="6" width="12" height="6" rx="1.5" ${c}/>`,
    note:`<path d="M4 3h18l6 6v11H4z" ${c}/><path d="M22 3v6h6" ${c}/>`,
    term:`<rect x="2" y="6" width="28" height="11" rx="5.5" ${c}/>`,
    dia:`<path d="M16 2l13 10-13 10L3 12z" ${c}/>`,
    para:`<path d="M7 3h23l-5 16H2z" ${c}/>`,
    doc:`<path d="M3 3h26v13c-4 3-9-2-13 1s-9 2-13-2z" ${c}/>`,
    sub:`<rect x="3" y="4" width="26" height="14" rx="2" ${c}/><path d="M8 4v14M24 4v14" ${c}/>`,
    trap:`<path d="M4 6h24l-5 12H9z" ${c}/>`,
    delay:`<path d="M6 4h14a8 8 0 0 1 0 16H6z" ${c}/>`,
    circle:`<circle cx="16" cy="12" r="8" ${c}/>`,
    pill:`<rect x="3" y="6" width="26" height="11" rx="5.5" ${c}/>`,
    table:`<rect x="3" y="3" width="26" height="18" rx="2" ${c}/><path d="M3 9h26M13 3v18" ${c}/>`};
  return `<svg viewBox="0 0 32 24">${s[k]||s.rect}</svg>`;
}

/* ---------- sample diagrams (absolute px, canvas-relative) ---------- */
function renderSample(kind){
  const f = document.getElementById('flowLayer');
  const e = document.getElementById('edgeLayer');
  const c = document.getElementById('canvas');
  const W = c.clientWidth, H = c.clientHeight;
  f.innerHTML=''; e.innerHTML='';
  const cx = W/2, cy = H/2;
  const N = (id,x,y,html,cls='') => `<div class="node ${cls}" id="${id}" style="left:${x}px;top:${y}px">${html}</div>`;
  const card=(k,t,s,m,nc)=>`<div class="topline" style="--nc:${nc}"></div><div class="k">${k}</div><div class="t">${t}</div><div class="s">${s}</div>${m?`<div class="m">${m}</div>`:''}`;

  if(kind==='architecture'){
    f.innerHTML =
      N('a1', cx-330, cy-70, card('external','CDC Source','change data capture','45 msg/s', col('accent')), '') +
      N('a2', cx-90, cy-70, card('service','ETL Consumers','kafkajs','5 pods', col('cyan'))) +
      N('a3', cx+150, cy-70, card('database','Warehouse','postgres','1.2 TB', col('violet')));
    edges([['a1','a2','produce'],['a2','a3','sink']], {dashed:false, labels:true, payload:true});
    legend([['accent','External system'],['cyan','Service'],['violet','Datastore']]);
  }
  if(kind==='flowchart'){
    f.innerHTML =
      N('t1', cx-60, 12, `<div class="t">Start</div>`, `term`) +
      N('p1', cx-75, 74, `<div class="t">Submit request</div>`) +
      N('d1', cx-75, 146, `<div class="dia"></div><div class="inner">Amount &gt; 1,000?</div>`, `dec`) +
      N('p2', cx-75, 262, `<div class="t">Auto-approve</div>`) +
      N('p3', cx+130, 200, `<div class="t">Manager review</div>`) +
      N('c1', cx+150, 320, `<div class="t">A</div>`, `circle`);
    edges([['t1','p1',''],['p1','d1',''],['d1','p2','Yes'],['d1','p3','No'],['p3','c1','']],
          {dashed:false, labels:true,
           back:[['p3','p1','retry']]});
    legend([['green','Terminal'],['cyan','Process'],['amber','Decision']]);
  }
  if(kind==='c4'){
    f.innerHTML =
      N('c1', cx-120, cy+90, `<div class="t">Customer</div><div class="s">[Person]</div>`, `round`) +
      N('c2', cx-330, cy-30, `<div class="t">Mobile App</div><div class="s">[Software System]</div>`) +
      N('c3', cx-90, cy-30, `<div class="t">Internet Banking</div><div class="s">[Software System]</div>`) +
      N('c4', cx+170, cy-30, `<div class="t">Mainframe</div><div class="s">[Software System, External]</div>`) +
      N('c5', cx-120, cy-190, `<div class="t">E-mail System</div><div class="s">[Software System, External]</div>`);
    edges([['c1','c2','uses'],['c2','c3','uses'],['c3','c4','reads/writes'],['c3','c5','sends events to']],
          {dashed:true, labels:true});
    legend([['green','Person'],['cyan','Internal'],['slate','External']]);
  }
  if(kind==='erd'){
    const tbl=(id,x,y,nc,name,rows)=>`<div class="tblnode" id="${id}" style="left:${x}px;top:${y}px;--nc:${nc}">
      <header>${name}</header>${rows.map(r=>`<div class="col">
        <span class="${r[2]||''}">${r[2]?'◆':''}</span><span class="name">${r[0]}</span><span class="ty">${r[1]}</span>
        ${r[3]==='pk'?'<span class="pk">PK</span>':r[3]==='fk'?'<span class="fk">FK</span>':'<span class="'+(r[4]?'nn':'nu')+'"></span>'}</div>`).join('')}</div>`;
    f.innerHTML =
      tbl('u', cx-380, cy-60, col('cyan'),'users',[['id','uuid','pk','pk'],['email','text','','nn'],['created_at','ts','']]) +
      tbl('o', cx-90, cy-60, col('cyan'),'orders',[['id','uuid','pk','pk'],['user_id','uuid','fk','fk'],['status','enum','']]) +
      tbl('oi', cx+200, cy-60, col('violet'),'order_items',[['id','uuid','pk','pk'],['order_id','uuid','fk','fk'],['qty','int','','nn']]);
    e.innerHTML = `<defs>
      <marker id="crow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
        <path d="M1 1L10 6M1 6L10 6M1 11L10 6" fill="none" stroke="${col('slate')}" stroke-width="1.4"/></marker>
      </defs>
      <path d="M${cx-200} ${cy-20} C ${cx-180} ${cy-20}, ${cx-160} ${cy-20}, ${cx-90} ${cy-20}" marker-end="url(#crow)"/>
      <text x="${cx-175}" y="${cy-30}">1:N</text>
      <path d="M${cx+90} ${cy-20} C ${cx+120} ${cy-20}, ${cx+160} ${cy-20}, ${cx+200} ${cy-20}" marker-end="url(#crow)"/>
      <text x="${cx+120}" y="${cy-30}">1:N</text>`;
    legend([['amber','Primary key ◆'],['cyan','Foreign key'],['slate','Crow’s foot 1:N']]);
  }
  if(kind==='mindmap'){
    f.innerHTML =
      N('m0', cx-55, cy-20, `<div class="t">Diagram Studio</div>`, 'round') +
      N('m1', cx-250, cy-100, `<div class="t">Rendering</div>`, 'round') +
      N('m2', cx-250, cy+50, `<div class="t">Presets</div>`, 'round') +
      N('m3', cx+140, cy-100, `<div class="t">Themes</div>`, 'round') +
      N('m4', cx+140, cy+50, `<div class="t">Export</div>`, 'round');
    edges([['m1','m0',''],['m2','m0',''],['m0','m3',''],['m0','m4','']],{dashed:false,labels:false});
    legend([['cyan','Topic'],['violet','Branch']]);
  }
}

/* ---------- edge rendering ---------- */
function nodeCenter(id){
  const n = document.getElementById(id); const c = document.getElementById('flowLayer').getBoundingClientRect();
  const r = n.getBoundingClientRect();
  return {x: r.left-c.left+r.width/2, y: r.top-c.top+r.height/2, t: r.top-c.top, b: r.bottom-c.top, l:r.left-c.left, r:r.right-c.left};
}
function edges(list, opt){
  const svg = document.getElementById('edgeLayer');
  let out='';
  const mk = (a,b,label,i)=>{
    const x1 = a.x, y1 = a.b ?? a.y, x2 = b.x, y2 = b.t ?? b.y;
    const d = opt.path==='straight'
      ? `M${a.x} ${a.y} L ${b.x} ${b.y}`
      : `M${x1} ${y1} C ${x1} ${(y1+y2)/2}, ${x2} ${(y1+y2)/2}, ${x2} ${y2}`;
    const mid = {x:(x1+x2)/2, y:(y1+y2)/2};
    let s = `<path class="${opt.dashed?'dashed':''}" d="${d}" marker-end="url(#arrow)"/>`;
    if(opt.payload && i===0) s += `<circle class="payload" r="3.4"><animateMotion dur="2.4s" repeatCount="indefinite" path="${d}"/></circle>`;
    if(opt.labels && label){ const w = label.length*6.4+12;
      s += `<rect class="lbl" x="${mid.x-w/2}" y="${mid.y-9}" width="${w}" height="16" rx="5"/>`+
           `<text x="${mid.x}" y="${mid.y+2.5}" text-anchor="middle">${label}</text>`; }
    return s;
  };
  const defs = `<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
    <path d="M0 0L9 4.5L0 9z" fill="${col('slate')}"/></marker></defs>`;
  list.forEach(([s,t,l],i)=>{ out += mk(nodeCenter(s), nodeCenter(t), l, i); });
  if(opt.back){ opt.back.forEach(([s,t,l])=>{
    const a=nodeCenter(s), b=nodeCenter(t);
    const d=`M${a.r} ${a.y} C ${a.r+80} ${a.y-40}, ${b.r+80} ${b.y-40}, ${b.r} ${b.y}`;
    out += `<path stroke-dasharray="5 4" d="${d}" marker-end="url(#arrow)"/>`;
    out += `<text x="${(a.r+b.r)/2+60}" y="${(a.y+b.y)/2-34}">${l}</text>`;
  });}
  svg.innerHTML = defs + out;
}

function legend(rows){
  document.getElementById('legendTitle').textContent = 'Legend';
  document.getElementById('legendRows').innerHTML = rows.map(([k,t])=>`<div class="lgrow"><span class="dot" style="background:${col(k)}"></span>${t}</div>`).join('');
  document.getElementById('legend').classList.toggle('on', !!rows.length);
}

/* ---------- state ---------- */
let cur = 'architecture';
let theme = 'dark';

function renderPresetChips(){
  const bar = document.getElementById('presetBar');
  bar.innerHTML = '<span class="lbl">Diagram type</span>' + Object.entries(PRESETS).map(([id,p])=>
    `<button class="pchip ${id===cur?'on':''}" data-p="${id}"><span>${p.label}</span><small>${p.hint}</small></button>`).join('');
  bar.querySelectorAll('.pchip').forEach(b=> b.onclick=()=>setPreset(b.dataset.p));
}
function renderPalette(){
  const p = PRESETS[cur];
  const pal = document.getElementById('palette');
  pal.innerHTML = p.palette.map(([shape,label,ck,g])=>
    `<div class="pit" title="${label}">${glyph(g, col(ck))}<span>${label}</span></div>`).join('');
  document.getElementById('palHint').innerHTML =
    `<b style="color:var(--fg)">${p.label}</b><br>Layout: <span class="mono">${p.layout}</span><br>Edge: <span class="mono">${p.edges.path}${p.edges.dashed?' · dashed':''}</span>`;
}
function renderInspector(){
  const p = PRESETS[cur];
  document.getElementById('inspector').innerHTML =
    `<div class="field"><label>Board diagram type</label><span class="badge">${p.label}</span></div>
     <div class="field"><label>Accent (symbolic key)</label>
       <div class="swatches">${['cyan','violet','amber','accent','green','pink','slate'].map((k,i)=>
         `<span class="sw ${i===0?'on':''}" style="background:${col(k)}" title="${k}"></span>`).join('')}</div>
       <div class="hint" style="padding:8px 0 0">Stored as a <b>key</b>, resolved per theme — so light mode recolours it. (Today it is stored as a hex string and can never be themed.)</div>
     </div>
     <div class="field"><label>Edge path</label><div class="row">
       ${['curved','smoothstep','step','straight'].map((v,i)=>`<button class="mbtn ${i===0?'on':''}">${v}</button>`).join('')}</div></div>
     <div class="field"><label>Flow animation</label><div class="row">
       ${['none','dots','dash','pulse','icon','event'].map((v,i)=>`<button class="mbtn ${i===1?'on':''}">${v}</button>`).join('')}</div></div>
     ${cur==='c4'?`<div class="warn">C4 preset: edges default to <b>dashed</b> with intent labels (uses / reads-writes / sends events to). Type is shown in the kicker (<span class="mono">[Software System]</span>).</div>`:''}
     ${cur==='erd'?`<div class="warn">ERD preset: <b>table</b> node — FK edges attach column-to-column, crow’s-foot markers show cardinality (1:N).</div>`:''}
     ${cur==='flowchart'?`<div class="warn">Flowchart preset: handles are <b>vertical</b> (top-in / bottom-out) so branches read top-to-bottom. Decision labels: <span class="mono">Yes / No</span>.</div>`:''}`;
}
function setPreset(id){ cur=id; renderPresetChips(); renderPalette(); renderInspector(); renderSample(PRESETS[id].sample); }
function setTheme(t){
  theme=t;
  let eff=t;
  if(t==='system') eff = matchMedia('(prefers-color-scheme: light)').matches ? 'light':'dark';
  document.documentElement.setAttribute('data-theme', eff);
  document.getElementById('themeName').textContent = t==='system'?('system → '+eff):t;
  document.querySelectorAll('#themeSeg button').forEach(b=> b.classList.toggle('on', b.dataset.themeBtn===t));
  // re-resolve colours everywhere
  renderPalette(); renderInspector(); renderSample(PRESETS[cur].sample); renderPresetChips();
}
document.querySelectorAll('#themeSeg button').forEach(b=> b.onclick=()=>setTheme(b.dataset.themeBtn));
matchMedia('(prefers-color-scheme: light)').addEventListener('change', ()=>{ if(theme==='system') setTheme('system'); });
window.addEventListener('resize', ()=>renderSample(PRESETS[cur].sample));

setPreset('architecture');
setTheme('dark');
</script>
</body>
