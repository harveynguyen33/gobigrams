<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Diagram Studio — tech-goblin</title>
    <!-- ITEM 1 — no theme flash on reload. This script is the boot theme writer
         and it runs in <head>, before anything paints, so the document can never
         show a theme React is about to replace. `:root` in styles.css defaults to
         DARK; without this, the window between that first paint and React's
         first committed effect painted the wrong theme.

         It MUST agree with App.tsx's FIRST commit, so it mirrors src/theme.ts
         exactly:
           stored   = localStorage['diagram-studio:theme'] (loadMode) — an
                      absent or unrecognised value reads as 'system'
           hasStored= the key exists at all (hasStoredMode)
           a concrete stored mode wins; otherwise, for a user who has NEVER
           chosen, the DEFAULT preset's suggested theme wins (App.tsx starts
           presetId at the default preset, so that suggestion is already in
           force at mount); otherwise 'system' resolves via matchMedia.
         The key string, the dark list and the default suggestion are asserted
         against src/theme.ts / src/presets.ts by checks/theme-boot-sync.mjs so a
         rename cannot silently desync the two. -->
    <script>
      (function () {
        var KEY = 'diagram-studio:theme';
        var DARK = ['dark', 'midnight', 'contrast'];
        var CONCRETE = DARK.concat(['light', 'paper']);
        var DEFAULT_SUGGEST = 'dark';
        try {
          var raw = window.localStorage.getItem(KEY);
          var stored = CONCRETE.indexOf(raw) >= 0 || raw === 'system' ? raw : 'system';
          var hasStored = raw !== null;
          var resolved;
          if (stored !== 'system') {
            resolved = stored;
          } else if (!hasStored && DEFAULT_SUGGEST) {
            resolved = DEFAULT_SUGGEST;
          } else {
            resolved = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          var el = document.documentElement;
          el.dataset.theme = resolved;
          el.classList.toggle('dark', DARK.indexOf(resolved) >= 0);
        } catch (e) { /* storage blocked — leave the :root dark default in place */ }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
